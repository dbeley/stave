// Release signing, applied by `scripts/android-sign-setup.sh`.
//
// Capacitor's generated app/build.gradle has no signingConfig, so
// `assembleRelease` emits app-release-unsigned.apk — an artifact Android refuses
// to install ("Missing META-INF/MANIFEST.MF"). Fine for a CI smoke build, useless
// for a release, so this is spliced in when you build a release APK.
//
// This file exists outside `android/` on purpose: the whole Android platform is
// generated by `cap add android` and is therefore git-ignored, so a change living
// inside it would be lost on the next regeneration.
//
// Values come from android/keystore.properties (git-ignored) or from the
// environment as ANDROID_KEYSTORE_*. With neither, the build still succeeds and
// still produces the unsigned artifact, which is what CI and a plain
// `just android-build` rely on — the failure mode to avoid is a build that cannot
// run at all on a machine with no signing key.

def keystorePropsFile = file('../keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// A name that is NOT `signing`: Gradle's `android {}` block exposes a generated
// `signing` property, and a local `def signing` is not a closure delegate — so
// inside `signingConfigs { release { storeFile … } }` the unresolved reference
// silently bound to the *generated* SigningConfig instead of this map, and the
// build failed with "Could not get unknown property 'signing'". Reading the map
// into plain locals before the block also keeps the lookups unambiguous.
def keystoreValues = [
    storeFile: keystoreProps.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: keystoreProps.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: keystoreProps.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: keystoreProps.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD'),
]
def hasSigningKey = keystoreValues.storeFile && keystoreValues.storePassword && keystoreValues.keyAlias && keystoreValues.keyPassword

def signingStoreFile = keystoreValues.storeFile
def signingStorePassword = keystoreValues.storePassword
def signingKeyAlias = keystoreValues.keyAlias
def signingKeyPassword = keystoreValues.keyPassword

android {
    signingConfigs {
        if (hasSigningKey) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Signed when a key is available; otherwise Gradle still produces the
            // unsigned artifact so a keyless machine can build.
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}
