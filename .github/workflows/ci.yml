name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: lint · types · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm lint:format

      - name: ESLint
        run: pnpm lint:eslint

      - name: Type check (svelte-check)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage report
        run: pnpm test:coverage
        continue-on-error: true

      - name: Production build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  e2e:
    name: e2e (Playwright, keyboard-driven)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg generates the royalty-free demo library the mock server serves.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate the demo library
        run: bash scripts/seed-library.sh testdata/music

      - name: Run end-to-end tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  nix:
    name: nix flake (build + checks + modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the SPA with Nix
        run: nix build .#default --print-build-logs

      - name: Run the flake checks (unit tests + NixOS module evaluation)
        run: nix flake check --keep-going --print-build-logs

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: quality
    # Informational: signing needs a keystore secret which a fork will not have.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and add the Android platform
        run: |
          pnpm build
          pnpm exec cap add android || true
          pnpm exec cap sync android

      - name: Assemble the debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
