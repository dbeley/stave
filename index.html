<!doctype html>
<html lang="en" data-theme="dark" data-accent="orange">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!--
      Runtime configuration (server prefill), overridden by the host at deploy
      time (see nix/module.nix). Deliberately a classic script, not a module:
      it must stay external so a deployment can replace it. Vite reports it as
      "can't be bundled" during the build — that is the intent, not a problem.
    -->
    <script src="./config.js" onerror="void 0"></script>
    <title>stave</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
