# Static hosting for the stave SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-based routing means there is only ever one HTML entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Deploy-time configuration: keep it revalidated too.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Streaming goes straight to the Subsonic server (a browser fetch), so no
    # proxy_pass for /rest/ is needed here. Add one if you want same-origin
    # requests:
    #
    # location /rest/ {
    #     proxy_pass http://navidrome:4533;
    #     proxy_buffering off;
    #     proxy_http_version 1.1;
    # }
}
